services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rippletrace
      POSTGRES_PASSWORD: rippletrace
      POSTGRES_DB: rippletrace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/rippletrace
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://rippletrace:rippletrace@postgres:5432/rippletrace
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: rippletrace
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      LLM_MODEL: ${LLM_MODEL:-qwen2.5-coder:7b}
      DOCS_DIR: /app/sample_docs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - neo4j
    volumes:
      - ./backend:/app
      - ./sample_docs:/app/sample_docs

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/tailwind.config.js:/app/tailwind.config.js
      - ./frontend/vite.config.js:/app/vite.config.js
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0  

volumes:
  pgdata:
  neo4jdata:
